name: "repo-cartographer"
description: "Enforce architecture rules and post an architecture diagram on pull requests."
branding:
  icon: "map"
  color: "blue"

inputs:
  path:
    description: "Path to the repository root to analyze."
    default: "."
  config:
    description: "Path to the rules file (default: auto-detect .cartographer.yml in path)."
    default: ""
  baseline:
    description: "Path to a baseline of accepted pre-existing violations (default: auto-detect .cartographer-baseline.json in path). Only NEW violations then fail the build."
    default: ""
  level:
    description: "Diagram granularity: 'high' or 'detail'."
    default: "high"
  format:
    description: "Diagram notation: 'mermaid' or 'dot'. The PR comment can only embed 'mermaid'; with 'dot' the comment omits the diagram and only the files are written."
    default: "mermaid"
  out:
    description: "Diagram output base path (writes <out>.html and <out>.mermaid)."
    default: "docs/architecture"
  version:
    description: "repo-cartographer npm version to run."
    default: "latest"
  comment:
    description: "Post/update a PR comment with the diagram and any violations."
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Enforce architecture rules
      shell: bash
      run: |
        CONFIG_ARG=""
        if [ -n "${{ inputs.config }}" ]; then CONFIG_ARG="--config ${{ inputs.config }}"; fi
        BASELINE_ARG=""
        if [ -n "${{ inputs.baseline }}" ]; then BASELINE_ARG="--baseline ${{ inputs.baseline }}"; fi
        npx -y "repo-cartographer@${{ inputs.version }}" check "${{ inputs.path }}" $CONFIG_ARG $BASELINE_ARG

    - name: Regenerate architecture diagram
      if: always()
      shell: bash
      run: |
        npx -y "repo-cartographer@${{ inputs.version }}" map "${{ inputs.path }}" \
          -o "${{ inputs.out }}" --level "${{ inputs.level }}" --format "${{ inputs.format }}"

    - name: Comment on the PR
      if: ${{ always() && inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      env:
        DIAGRAM_OUT: ${{ inputs.out }}
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- repo-cartographer -->';
          const outBase = process.env.DIAGRAM_OUT || 'docs/architecture';
          const mermaidPath = `${outBase}.mermaid`;
          const mermaid = fs.existsSync(mermaidPath) ? fs.readFileSync(mermaidPath, 'utf8').trim() : '';
          const violations = fs.existsSync('violations.json')
            ? JSON.parse(fs.readFileSync('violations.json', 'utf8')) : [];
          const errs = violations.filter(v => v.level === 'error').length;
          const warns = violations.length - errs;
          const head = violations.length
            ? `**${errs} error(s), ${warns} warning(s)**`
            : '✅ No architecture rule violations.';
          const list = violations.map(v => {
            const icon = v.level === 'error' ? '❌' : '⚠️';
            return v.kind === 'forbidden'
              ? `${icon} \`${v.from}\` → \`${v.to}\` — ${v.reason}`
              : `${icon} ${v.reason}`;
          }).join('\n');
          const body = [
            marker,
            '### 🗺️ Architecture check',
            '',
            head,
            list ? '\n' + list : '',
            '',
            '<details><summary>Architecture diagram</summary>',
            '',
            '```mermaid',
            mermaid,
            '```',
            '',
            '</details>',
          ].join('\n');

          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
